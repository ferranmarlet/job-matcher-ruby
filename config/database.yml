default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>

local: &local
  <<: *default
  username: <%= ENV.fetch("DB_USERNAME") { "jobscan" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "jobscan" } %>

development:
  <<: *local
  database: <%= ENV.fetch("DB_NAME") { "jobscan" } %>
  database_tasks: false

test:
  <<: *local
  database: job_matcher_ruby_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "jobscan" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "job_matcher_app" } %>
  sslmode: require
  database_tasks: false
